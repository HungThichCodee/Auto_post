name: Auto Post Video Pipeline

on:
  schedule:
    # Run every 3 hours as base schedule
    - cron: '0 */3 * * *'
  workflow_dispatch:
    # Allow manual triggering

# Secrets required:
#   - GEMINI_API_KEY: Google AI Studio free API key
#   - YT_COOKIES: YouTube session cookies as JSON string
#   - PROXY_LIST: (Optional) Comma-separated proxy URLs

jobs:
  auto-post:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk fonts-noto-color-emoji

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps

      - name: Random delay (0-180 minutes for 3-6hr randomization)
        if: github.event_name == 'schedule'
        run: |
          DELAY=$((RANDOM % 10800))
          echo "Sleeping for $DELAY seconds ($((DELAY / 60)) minutes)..."
          sleep $DELAY

      - name: Run video pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          PROXY_LIST: ${{ secrets.PROXY_LIST }}
        run: |
          python -m src.main run

      - name: Upload logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs-${{ github.run_number }}
          path: output/auto_post.log
          retention-days: 7

      - name: Commit knowledge base updates
        if: success()
        run: |
          git config user.name "Auto Post Bot"
          git config user.email "bot@auto-post.local"
          git add knowledge_base.md
          git diff --staged --quiet || git commit -m "📝 Update knowledge base — $(date '+%Y-%m-%d %H:%M')"
          git push
