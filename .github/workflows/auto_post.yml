name: Auto Post Video Pipeline

on:
  schedule:
    # Run every 3 hours as base schedule
    - cron: '0 */3 * * *'
  workflow_dispatch:
    # Allow manual triggering

# Secrets required:
#   - GEMINI_API_KEY: Google AI Studio free API key
#   - YT_CLIENT_ID: YouTube Data API Client ID
#   - YT_CLIENT_SECRET: YouTube Data API Client Secret
#   - YT_REFRESH_TOKEN: YouTube Data API Refresh Token
#   - PROXY_LIST: (Optional) Comma-separated proxy URLs

jobs:
  auto-post:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick fonts-noto-cjk fonts-noto-color-emoji
          # Fix ImageMagick security policy for MoviePy text rendering
          if [ -f /etc/ImageMagick-6/policy.xml ]; then
            sudo sed -i 's/rights="none" pattern="@\*"/rights="read" pattern="@\*"/g' /etc/ImageMagick-6/policy.xml
          fi

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps

      - name: Random delay (5-30 minutes)
        if: github.event_name == 'schedule'
        run: |
          DELAY=$((RANDOM % 1501 + 300))
          echo "Sleeping for $DELAY seconds ($((DELAY / 60)) minutes)..."
          sleep $DELAY

      - name: Run video pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          PROXY_LIST: ${{ secrets.PROXY_LIST }}
        run: |
          python -m src.main run

      - name: Upload logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs-${{ github.run_number }}
          path: output/auto_post.log
          retention-days: 7

      - name: Commit knowledge base updates
        if: success()
        run: |
          git config user.name "Auto Post Bot"
          git config user.email "bot@auto-post.local"
          git add knowledge_base.md
          git diff --staged --quiet || (git commit -m "📝 Update knowledge base — $(date '+%Y-%m-%d %H:%M')" && git push)
